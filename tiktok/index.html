<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Golden Quarter, free course | ClickClick</title>
  <!-- The address in the TikTok bio. TikTok bio links are not clickable, so
       people type it and no referrer comes with them; this path is how those
       sign-ups get counted as TikTok. /free does the rest. -->
  <meta name="robots" content="noindex, follow" />
  <meta http-equiv="refresh" content="0; url=/free/?src=tiktok" />
  <script>window.location.replace('/free/?src=tiktok');</script>
</head>
<body>
  <p><a href="/free/?src=tiktok">Open the free course</a></p>
</body>
</html>
